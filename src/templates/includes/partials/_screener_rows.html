{% for t in tokens %}
<tr class="sort-row {{ 'large-cap' if t.large_cap }}" onclick="openTokenSheet(this)"
    data-id="{{ t.id }}" data-symbol="{{ t.symbol|upper }}" data-name="{{ t.name }}"
    data-image="{{ t.image or '' }}" data-price="{{ t.fmt_price }}" data-mcap="{{ t.fmt_mcap }}"
    data-volume="{{ t.fmt_volume }}" data-vtmr="{{ t.vtmr_display }}" data-vtmr-class="{{ t.vtmr_class }}"
    data-p24h="{{ t.fmt_24h }}" data-cls24h="{{ t.cls_24h }}" data-p7d="{{ t.fmt_7d }}" data-cls7d="{{ t.cls_7d }}"
    data-p30d="{{ t.fmt_30d }}" data-cls30d="{{ t.cls_30d }}" data-p1y="{{ t.fmt_1y }}" data-cls1y="{{ t.cls_1y }}"
    data-sort-price="{{ t.current_price or 0 }}" data-sort-mcap="{{ t.market_cap or 0 }}" data-sort-volume="{{ t.total_volume or 0 }}"
    data-sort-vtmr="{{ t.vtmr_raw }}" data-sort-p24h="{{ t.price_change_percentage_24h_in_currency or 0 }}"
    data-sort-p7d="{{ t.price_change_percentage_7d_in_currency or 0 }}" data-sort-p30d="{{ t.price_change_percentage_30d_in_currency or 0 }}"
    data-sort-p1y="{{ t.price_change_percentage_1y_in_currency or 0 }}">
    <td>
        <div class="asset-cell">
            {% if t.image %}<img src="{{ t.image }}" loading="lazy">{% endif %}
            <span class="asset-symbol">{{ t.symbol|upper }}</span>
            <span class="asset-name">{{ t.name }}</span>
        </div>
    </td>
    <td class="watchlist-cell" onclick="event.stopPropagation()">
        <button class="watchlist-btn" onclick="toggleWatchlist(this, '{{ t.id }}')"
                data-starred="{{ 'true' if t.starred else 'false' }}"
                title="{{ 'Remove from watchlist' if t.starred else 'Add to watchlist' }}">
            <svg fill="{{ 'currentColor' if t.starred else 'none' }}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
            </svg>
        </button>
    </td>
    <td class="align-right mono" style="font-weight:700; color:#fff;">{{ t.fmt_price }}</td>
    <td class="align-right mono" style="color:var(--text-dim);">{{ t.fmt_mcap }}</td>
    <td class="align-right mono" style="color:var(--text-dim);">{{ t.fmt_volume }}</td>
    <td class="align-right mono {{ t.vtmr_class }}">{{ t.vtmr_display }}</td>
    <td class="align-right mono {{ t.cls_24h }}" style="font-weight:700;">{{ t.fmt_24h }}</td>
    <td class="align-right mono {{ t.cls_7d }}">{{ t.fmt_7d }}</td>
    <td class="align-right mono {{ t.cls_30d }}">{{ t.fmt_30d }}</td>
    <td class="align-right mono {{ t.cls_1y }}" style="font-weight:700;">{{ t.fmt_1y }}</td>
</tr>
{% else %}
<tr><td colspan="10" style="text-align:center; padding:60px 20px; color:var(--text-dim);">No assets match your filters.</td></tr>
{% endfor %}
